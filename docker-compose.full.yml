# Полный локальный стек одной командой, без установки Node/pnpm/PostgreSQL
# на хосте — нужен только Docker Desktop.
#
#   docker compose -f docker-compose.full.yml up --build
#
# Затем открыть http://localhost:3000
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sem
      POSTGRES_PASSWORD: sem
      POSTGRES_DB: sem
    volumes:
      - sem_full_db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://sem:sem@db:5432/sem?schema=public"
      JWT_ACCESS_SECRET: "dev-access-secret-change-me"
      JWT_REFRESH_SECRET: "dev-refresh-secret-change-me"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "30d"
      PORT: "4000"
      WEB_ORIGIN: "http://localhost:3000"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  sem_full_db_data:
