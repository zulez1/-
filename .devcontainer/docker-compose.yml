services:
  app:
    image: node:22-bookworm-slim
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: "postgresql://sem:sem@db:5432/sem?schema=public"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sem
      POSTGRES_PASSWORD: sem
      POSTGRES_DB: sem
    volumes:
      - sem_db_data:/var/lib/postgresql/data

volumes:
  sem_db_data:
